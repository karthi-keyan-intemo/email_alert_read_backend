services:
  backend:
    build:
      context: .
    container_name: email_alert_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgresadmin:${POSTGRES_PASSWORD}@host.docker.internal:5433/email_alert_reader
      EMAIL: ${EMAIL}
      APP_PASSWORD: ${APP_PASSWORD}
      GMAIL_FOLDER: ${GMAIL_FOLDER}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      CRON_ENABLED: ${CRON_ENABLED:-false}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-30 4 * * *}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Asia/Kolkata}
      CRON_LOOKBACK_DAYS: ${CRON_LOOKBACK_DAYS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: email_alert_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
